name: Scan flights

on:
  schedule:
    # GitHub cron is UTC and can start a few minutes late.
    # 05:00 UTC = 08:00 in Chișinău in summer (07:00 in winter); 18:00 UTC = 21:00 (20:00 in winter).
    - cron: '0 5 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # commit the refreshed deals back to the repo

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the commit that triggered a queued run, so the alert history is current.
          ref: ${{ github.ref_name }}
          # Keep the push token away from the scan step; only the commit step gets it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Scan Wizz Air fares from RMO
        run: |
          # Link to the GitHub Pages site in the Telegram message, e.g. https://you.github.io/zboruri/
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          node src/index.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: fares for every airline (free token from travelpayouts.com); the marker earns commission.
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          # Optional: destination photos (free key from pexels.com/api).
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # Runs even if the Telegram alert failed, so the website and alert history still update.
      - name: Commit refreshed deals
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update flight deals"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Someone may have pushed during the scan: rebase onto it and try again.
          for attempt in 1 2 3; do
            if git pull --rebase "$remote" "$GITHUB_REF_NAME" && git push "$remote" "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the refreshed deals"
          exit 1
